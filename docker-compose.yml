services:
  postgres:
    image: postgres:16-alpine
    container_name: doctorcom-postgres
    environment:
      POSTGRES_DB: doctor_com
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doctor_com"]
      interval: 5s
      timeout: 5s
      retries: 10

  medications-postgres:
    image: postgres:16-alpine
    container_name: doctorcom-medications-postgres
    environment:
      POSTGRES_DB: doctor_com_medicaments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - medications_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doctor_com_medicaments"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: doctorcom-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: doctorcom-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctorcom-app
    env_file:
      - apps/server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_DIST_DIR: /app/apps/server/public
      APP_SERVER_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/doctor_com
      MEDICATIONS_DATABASE_URL: postgresql://postgres:postgres@medications-postgres:5432/doctor_com_medicaments
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: gemma4:e2b
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      medications-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  medications_postgres_data:
  minio_data:
  ollama_data:
